version: 2
updates:
  # Python runtime and dev dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - "psutil"
          - "pydantic*"
      python-dev:
        patterns:
          - "pip-tools"
          - "pre-commit"
          - "build"
          - "wheel"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # npm — playwright-pro MCP integrations
  - package-ecosystem: npm
    directory: "/skills/playwright-pro/integrations/browserstack-mcp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/skills/playwright-pro/integrations/testrail-mcp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/skills/engineering-team/playwright-pro/integrations/browserstack-mcp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: "/skills/engineering-team/playwright-pro/integrations/testrail-mcp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # NOTE: /skills/dependency-auditor/test-project is intentionally a
  # deliberately-vulnerable sample fixture used by the dependency-auditor
  # skill to demonstrate vulnerability scanning. It is never installed or
  # shipped, so it is deliberately excluded from Dependabot version updates
  # to avoid generating noise from non-shippable sample data.
