name: Python CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prod.lock
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install -r requirements-dev.txt
          else
            # CUDA-only wheels (cuda-*, nvidia-*, triton) publish no macOS
            # builds, and newer revisions (e.g. nvidia-cufile 1.15.1.6) also
            # ship no Windows builds, while pip-compile/dependabot
            # regenerations drop the darwin markers kept in
            # requirements-dev.txt. Filter them here, where the exclusion
            # cannot silently regress; the CPU test-suite needs none of them.
            grep -v -E '^(cuda-|nvidia-|triton==)' requirements-dev.txt > /tmp/requirements-ci-nocuda.txt
            python -m pip install -r /tmp/requirements-ci-nocuda.txt
          fi
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Audit Python dependencies for CVEs
        run: python -m pip_audit --requirement requirements-prod.lock --strict

      - name: Run pre-commit checks
        if: runner.os == 'Linux'
        run: python -m pre_commit run --all-files

      - name: Run release validation gate
        run: python run.py validate

      - name: Run quantum consensus simulation verification
        run: python scripts/quantum_sim_verify.py

      - name: Run pytest with coverage
        shell: bash
        run: |
          python -m pytest tests/ --ignore=tests/test_local_llm_quality.py \
            --cov=core --cov-report=term-missing --cov-fail-under=60 -q

      - name: Run AGI integration tests
        run: python -m pytest tests/test_agi_complete_loop.py -v

  full-discovery:
    name: Full discovery sweep
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prod.lock
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ".[dev]"

      - name: Run full unittest discovery sweep
        run: python run.py validate --pattern test_*.py

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: full-discovery

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build distributions
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openchimera-dist-ci
          path: dist/*

  smoke-install:
    name: Smoke install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: openchimera-dist-ci
          path: dist

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Run package smoke checks
        shell: bash
        run: |
          openchimera bootstrap
          openchimera doctor --production --json
          openchimera status --json
          openchimera backup create --json
