[package]
name = "chimera-tui"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "openchimera"
path = "src/main.rs"

[dependencies]
chimera-core = { path = "../chimera-core" }
tokio = { version = "1.40", features = ["full"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
