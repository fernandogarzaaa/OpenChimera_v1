[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openchimera"
version = "2.0.0"
description = "OpenChimera v2 — Agentic orchestration runtime with Rust TUI, modern AI providers, and cognitive stack integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Fernando Garza" },
]
keywords = ["agent", "orchestration", "llm", "mcp", "cognitive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "structlog>=25.1,<26",
    "rich>=13.9,<14",
    "click>=8.1,<9",
    "httpx-sse>=0.4,<1",
    "openai>=1.60,<2",
    "anthropic>=0.42,<1",
    "google-generativeai>=0.8,<1",
    "groq>=0.18,<1",
    "ollama>=0.4,<1",
    "mcp>=1.6,<2",
    "tiktoken>=0.8,<1",
    "psutil>=6.0,<7",
]

[project.optional-dependencies]
rag = [
    "chromadb>=0.6,<1",
    "sentence-transformers>=3.4,<4",
    "faiss-cpu>=1.10,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
openchimera = "openchimera.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/openchimera"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["python/tests"]
