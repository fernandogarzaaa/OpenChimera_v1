[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openchimera"
version = "2.0.0"
description = "OpenChimera v2 — Agentic orchestration runtime with Rust TUI, modern providers, and cognitive stack integration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Fernando Garza", email = "fernandogarzaaa@gmail.com" }
]
keywords = ["ai", "agent", "orchestration", "llm", "mcp", "cognitive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: TypeScript",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "psutil>=6.1.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "asyncio-throttle>=1.0.2",
]

[project.optional-dependencies]
providers = [
    "openai>=1.55.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "groq>=0.12.0",
    "ollama>=0.4.0",
    "mistralai>=1.2.0",
    "cohere>=5.12.0",
    "boto3>=1.35.0",
    "ai21>=3.0.0",
]
cognitive = [
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.0",
    "numpy>=2.1.0",
]
computer-use = [
    "playwright>=1.48.0",
    "pillow>=11.0.0",
    "pyautogui>=0.9.54",
]
mcp = [
    "mcp>=1.0.0",
]
all = [
    "openai>=1.55.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "groq>=0.12.0",
    "ollama>=0.4.0",
    "mistralai>=1.2.0",
    "cohere>=5.12.0",
    "boto3>=1.35.0",
    "ai21>=3.0.0",
    "sentence-transformers>=3.3.0",
    "chromadb>=0.5.0",
    "numpy>=2.1.0",
    "playwright>=1.48.0",
    "pillow>=11.0.0",
    "pyautogui>=0.9.54",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
openchimera = "openchimera.cli:main"
chimera = "openchimera.cli:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/OpenChimera_v1"
Repository = "https://github.com/fernandogarzaaa/OpenChimera_v1"
Issues = "https://github.com/fernandogarzaaa/OpenChimera_v1/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/openchimera"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
